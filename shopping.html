<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3GG3kGs4ofwg6qsjWcZC3nkn0SrjVJ3A",
            authDomain: "haushaltsbuch-4ea86.firebaseapp.com",
            projectId: "haushaltsbuch-4ea86",
            storageBucket: "haushaltsbuch-4ea86.firebasestorage.app",
            messagingSenderId: "639032934816",
            appId: "1:639032934816:web:a1d42ee5c46982966324c5",
            measurementId: "G-BSM6HL36QQ"
        };

        // Firebase initialisieren
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let activeAccountId = null;
        let unsubscribeRealtime = null;
        let shoppingItems = [];
        let currentTheme = localStorage.getItem('theme') || 'light';

        // Auth Status-Überwachung
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('main-app-container').classList.remove('hidden');
                await determineActiveAccount(user.uid);
                startRealtimeListener();
            } else {
                currentUser = null; 
                activeAccountId = null;
                if (unsubscribeRealtime) unsubscribeRealtime();
                document.getElementById('main-app-container').classList.add('hidden');
                document.getElementById('auth-container').classList.remove('hidden');
            }
        });

        // Partner-Verknüpfung prüfen
        async function determineActiveAccount(uid) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists() && userSnap.data().partnerId) {
                    activeAccountId = userSnap.data().partnerId;
                } else {
                    activeAccountId = uid;
                }
            } catch (e) {
                console.error("Fehler beim Abrufen des Accounts: ", e);
                activeAccountId = uid; // Fallback
            }
        }

        // Realtime Listener für die Einkaufsliste
        function startRealtimeListener() {
            if (unsubscribeRealtime) unsubscribeRealtime();
            
            const listDocRef = doc(db, "haushaltsbuecher", activeAccountId);
            unsubscribeRealtime = onSnapshot(listDocRef, (docSnap) => {
                const data = docSnap.exists() ? docSnap.data() : {};
                shoppingItems = data.shoppingItems || [];
                updateUI();
            }, (error) => {
                console.error("Fehler im Realtime-Listener: ", error);
            });
        }

        // Daten in die Cloud speichern
        async function saveCloudData() {
            if (!activeAccountId) return;
            try {
                const listDocRef = doc(db, "haushaltsbuecher", activeAccountId);
                await setDoc(listDocRef, { shoppingItems }, { merge: true });
            } catch (e) { 
                console.error("Fehler beim Speichern: ", e); 
            }
        }

        // Artikel hinzufügen
        function addItem() {
            const input = document.getElementById('item-name');
            const name = input.value.trim();
            if (!name) return;

            shoppingItems.push({
                id: Date.now().toString(),
                name: name,
                bestPrice: "",
                createdAt: new Date().toISOString()
            });

            input.value = '';
            updateUI();
            saveCloudData();
        }

        // Artikel löschen
        function deleteItem(id) {
            shoppingItems = shoppingItems.filter(item => item.id !== id);
            updateUI();
            saveCloudData();
        }

        // Bestpreis updaten
        function updateBestPrice(id, value) {
            const item = shoppingItems.find(i => i.id === id);
            if (item) {
                item.bestPrice = value;
                saveCloudData();
            }
        }

        // Preissuche via Google Shopping
        function searchCheapestPrice(itemName) {
            const searchQuery = encodeURIComponent(itemName);
            const url = `https://www.google.com/search?tbm=shop&q=${searchQuery}`;
            window.open(url, '_blank');
        }

        // UI rendern
        function updateUI() {
            const list = document.getElementById('shopping-list');
            if (!list) return;
            list.innerHTML = '';

            if (shoppingItems.length === 0) {
                list.innerHTML = '<p class="text-muted text-center py-4 text-sm font-light">Der Kühlschrank ist voll! Keine offenen Artikel.</p>';
                return;
            }

            // Kopie erstellen und sortieren (um Mutation des Original-Arrays während Events zu verhindern)
            const sortedItems = [...shoppingItems].sort((a, b) => b.createdAt.localeCompare(a.createdAt));

            sortedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex flex-col md:flex-row md:items-center justify-between p-3 rounded-xl border border-custom bg-gray-500/5 border-l-4 border-amber-500 gap-3';
                
                div.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p class="font-medium text-sm text-title">${item.name}</p>
                            <button id="search-btn-${item.id}" class="p-1 rounded bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 text-xs flex items-center gap-1 transition" title="Günstigsten Online-/Einzelhandelspreis suchen">
                                <span>🔍</span> <span class="text-[10px] font-bold">Preis prüfen</span>
                            </button>
                        </div>
                        <div class="mt-1 flex items-center gap-1.5">
                            <span class="text-[11px] text-muted whitespace-nowrap">Unser Bestpreis:</span>
                            <input type="text" 
                                id="price-input-${item.id}"
                                value="${item.bestPrice || ''}" 
                                placeholder="z.B. 1,49 € bei REWE" 
                                class="bg-transparent border-b border-dashed border-custom text-[11px] focus:outline-none focus:border-blue-500 w-full max-w-[180px] text-title font-medium"
                            >
                        </div>
                    </div>
                    <div class="flex items-center justify-end shrink-0">
                        <button id="done-btn-${item.id}" class="bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500/20 text-xs px-3 py-1.5 rounded-lg font-semibold transition w-full md:w-auto text-center">
                            ✓ Erledigt
                        </button>
                    </div>
                `;
                list.appendChild(div);

                // Event Listener sauber im Module-Scope setzen (verhindert 'Uncaught ReferenceError')
                document.getElementById(`search-btn-${item.id}`).addEventListener('click', () => searchCheapestPrice(item.name));
                document.getElementById(`price-input-${item.id}`).addEventListener('change', (e) => updateBestPrice(item.id, e.target.value));
                document.getElementById(`done-btn-${item.id}`).addEventListener('click', () => deleteItem(item.id));
            });
        }

        // Theme steuern
        function applyTheme() {
            const body = document.getElementById('app-body'), btn = document.getElementById('theme-btn');
            body.className = "font-sans min-h-screen pb-10 " + (currentTheme === 'dark' ? 'dark-mode' : 'light-mode');
            btn.innerText = currentTheme === 'dark' ? "🌙" : "☀️";
            localStorage.setItem('theme', currentTheme);
        }

        // Globale Event-Listener zuweisen
        document.getElementById('theme-btn').addEventListener('click', () => { 
            currentTheme = currentTheme === 'light' ? 'dark' : 'light'; 
            applyTheme(); 
            updateUI();
        });

        document.getElementById('add-item-btn').addEventListener('click', addItem);
        document.getElementById('item-name').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Initialer Theme-Aufruf
        applyTheme();
    </script>
</body>
